# Banc d'essai de controle-production.sh et de maintenance.sh (essais-controle.sh, dans ce dossier) : mêmes noms de services,
# même image de Caddy, même montage du Caddyfile et même volume /data qu'en production. L'API et le site sont remplacés par
# un petit serveur (serveur.js) ; la base reçoit les vraies migrations et des données fictives. Variables données par
# essais-controle.sh : BANC_ECOLE (copie du dépôt, comme ~/ecole), BANC_APP (dossier du petit serveur), BANC_PORT.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: essai
      ERP_OWNER_PASSWORD: erp_owner_essai
      ERP_APP_PASSWORD: erp_app_essai
      ERP_PLATFORM_PASSWORD: erp_platform_essai
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ${BANC_ECOLE:?}/infra/postgres/init-roles.sh:/docker-entrypoint-initdb.d/10-init-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d erp"]
      interval: 2s
      retries: 60

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  api:
    build:
      context: ${BANC_APP:?}
      dockerfile: ${BANC_DOCKERFILE_API:-Dockerfile.avant}
      args:
        CAHIORA_COMMIT: ${CAHIORA_COMMIT:-inconnu}
        ROLE_ESSAI: api
        PORT_ESSAI: "4000"
    restart: unless-stopped
    environment:
      BILLING_PAYMENTS_UNLOCKED: "false"
    depends_on:
      postgres: { condition: service_healthy }

  web:
    build:
      context: ${BANC_APP:?}
      dockerfile: ${BANC_DOCKERFILE_WEB:-Dockerfile.avant}
      args:
        CAHIORA_COMMIT: ${CAHIORA_COMMIT:-inconnu}
        ROLE_ESSAI: web
        PORT_ESSAI: "3000"
    restart: unless-stopped
    depends_on: [api]

  # Le service existe en production (antivirus) ; ici, un conteneur qui ne fait rien.
  clamav:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["sleep", "infinity"]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [web, api]
    environment:
      SITE_ADDRESS: ":80" # banc : http seulement (en production, https:// du .env)
    ports:
      - "127.0.0.1:${BANC_PORT:-18191}:80"
    volumes:
      - ${BANC_ECOLE:?}/infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data

volumes:
  pgdata:
  caddydata:
