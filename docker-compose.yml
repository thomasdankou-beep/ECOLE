# Lancement complet en local ou sur un serveur : docker compose up -d --build
# Copiez d'abord .env.docker.example en .env et remplissez les secrets.
# SEC-048 : journaux de chaque service limités à 5 fichiers de 10 Mo (le journal d'audit, lui, est dans la base).
x-journaux: &journaux
  logging:
    driver: json-file
    options: { max-size: 10m, max-file: "5" }

services:
  postgres:
    <<: *journaux
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?à définir dans .env}
      ERP_OWNER_PASSWORD: ${ERP_OWNER_PASSWORD:?à définir dans .env}
      ERP_APP_PASSWORD: ${ERP_APP_PASSWORD:?à définir dans .env}
      ERP_PLATFORM_PASSWORD: ${ERP_PLATFORM_PASSWORD:-}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init-roles.sh:/docker-entrypoint-initdb.d/10-init-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d erp"]
      interval: 5s
      retries: 20

  redis:
    <<: *journaux
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data

  api:
    <<: *journaux
    build: { context: ., dockerfile: apps/api/Dockerfile }
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    environment:
      DATABASE_URL: postgresql://erp_app:${ERP_APP_PASSWORD}@postgres:5432/erp
      # Propriétaire : migrations au démarrage et commandes d'administration seulement ; retiré du processus de l'API (Dockerfile).
      DATABASE_ADMIN_URL: postgresql://erp_owner:${ERP_OWNER_PASSWORD}@postgres:5432/erp
      # Super Admin : rôle dédié, sans droits de propriétaire (SEC-009).
      DATABASE_PLATFORM_URL: postgresql://erp_platform:${ERP_PLATFORM_PASSWORD:?à définir dans .env (relancer ./installer-serveur.sh ou ./demarrer.sh)}@postgres:5432/erp
      # Console des groupes (lot G2) : rôle dédié, cloisonné sur le groupe de la session, sans aucun droit sur les tables d'école.
      DATABASE_GROUP_URL: postgresql://erp_group:${ERP_GROUP_PASSWORD:?à définir dans .env (relancer ./installer-serveur.sh ou ./demarrer.sh)}@postgres:5432/erp
      REDIS_URL: redis://redis:6379
      PORT: 4000
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:8080}
      PUBLIC_API_URL: ${WEB_ORIGIN:-http://localhost:8080}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?à définir dans .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?à définir dans .env}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?à définir dans .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-sandbox}
      ALLOW_SANDBOX_PAYMENTS: ${ALLOW_SANDBOX_PAYMENTS:-false}
      CINETPAY_API_KEY: ${CINETPAY_API_KEY:-}
      CINETPAY_SITE_ID: ${CINETPAY_SITE_ID:-}
      CINETPAY_SECRET_KEY: ${CINETPAY_SECRET_KEY:-}
      SMS_PROVIDER: ${SMS_PROVIDER:-console}
      # SMS_PROVIDER=bulkgate : identifiants de l'application BulkGate et nom d'expéditeur par défaut (plateforme).
      BULKGATE_APPLICATION_ID: ${BULKGATE_APPLICATION_ID:-}
      BULKGATE_APPLICATION_TOKEN: ${BULKGATE_APPLICATION_TOKEN:-}
      SMS_SENDER: ${SMS_SENDER:-}
      # SEC-044 : texte des SMS « console » dans les journaux, poste de démonstration seulement.
      SMS_CONSOLE_SHOW_TEXT: ${SMS_CONSOLE_SHOW_TEXT:-false}
      # SEC-045 : documentation /api/docs, fermée en production sauf API_DOCS=true.
      API_DOCS: ${API_DOCS:-false}
      TENANT_SLUG: ${TENANT_SLUG-saint-kisito}
      PLATFORM_DOMAIN: ${PLATFORM_DOMAIN:-}
      # SEC-038 : true sur le serveur (posé par installer-serveur.sh) ; le jeu de démonstration y est refusé.
      PRODUCTION_SERVER: ${PRODUCTION_SERVER:-false}
      ALLOW_DEMO_RESET: ${ALLOW_DEMO_RESET:-}
      STORAGE_DIR: /repo/apps/api/storage
      # Antivirus (SEC-026) : chaque fichier envoyé est analysé par le service « clamav » avant d'être enregistré.
      # Si l'antivirus ne répond pas, l'envoi est refusé. Vide : pas d'analyse (déconseillé en production).
      CLAMAV_HOST: ${CLAMAV_HOST-clamav}
    volumes:
      - uploads:/repo/apps/api/storage

  # Antivirus ClamAV (SEC-026) : signatures mises à jour automatiquement plusieurs fois par jour.
  # Environ 1 à 1,5 Go de mémoire ; 1 à 2 minutes au premier démarrage pour télécharger les signatures.
  clamav:
    <<: *journaux
    image: clamav/clamav:1.4
    restart: unless-stopped
    volumes:
      - clamavdb:/var/lib/clamav

  web:
    <<: *journaux
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_URL: http://api:4000
        NEXT_PUBLIC_TENANT: ${TENANT_SLUG-saint-kisito}
        NEXT_PUBLIC_DEMO: ${SHOW_DEMO_ACCOUNTS:-true}
    restart: unless-stopped
    depends_on: [api]

  caddy:
    <<: *journaux
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [web, api]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "443:443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data

volumes:
  pgdata:
  redisdata:
  uploads:
  caddydata:
  clamavdb:
